<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taller de modelos · Meta Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --fondo: #14161f;
        --panel: #1c1f2c;
        --borde: #2c3042;
        --texto: #e9eaf2;
        --suave: #9095ab;
        --acento: #ff8a3d;
        --ada: #5ee0ff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); font: 14px/1.4 Rubik, system-ui, sans-serif; }
      body { display: grid; grid-template-columns: 220px 1fr 330px; height: 100vh; overflow: hidden; }
      aside { background: var(--panel); border-color: var(--borde); border-style: solid; border-width: 0; overflow-y: auto; padding: 18px; }
      #lista { border-right-width: 1px; }
      #panel { border-left-width: 1px; }
      main { position: relative; min-width: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      h1 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); margin: 0 0 14px; }
      h2 { font-size: 22px; margin: 0 0 2px; }
      h3 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); margin: 20px 0 8px; }
      .rol { color: var(--suave); margin: 0 0 12px; }
      .modelo { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px; border-radius: 10px; border: 1px solid var(--borde); background: transparent; color: var(--texto); font: inherit; cursor: pointer; }
      .modelo small { display: block; color: var(--suave); }
      .modelo.activo { border-color: var(--acento); background: rgba(255, 138, 61, .12); }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .stats div { background: #232737; border-radius: 8px; padding: 8px; }
      .stats b { display: block; font-size: 16px; }
      .stats small { color: var(--suave); font-size: 11px; }
      .botones { display: flex; flex-wrap: wrap; gap: 6px; }
      button.clip, button.vel, button.accion { padding: 7px 11px; border-radius: 8px; border: 1px solid var(--borde); background: #262a3b; color: var(--texto); font: 500 13px Rubik, sans-serif; cursor: pointer; }
      button.clip.activo, button.vel.activo { background: var(--acento); border-color: var(--acento); color: #1a1208; }
      button.accion { width: 100%; margin-top: 8px; background: var(--texto); color: #15161d; font-weight: 700; }
      .barra { height: 8px; background: #262a3b; border-radius: 4px; overflow: hidden; margin: 10px 0 4px; }
      .barra i { display: block; height: 100%; width: 0; background: var(--acento); }
      input[type=range] { width: 100%; accent-color: var(--acento); }
      .opciones label { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; color: var(--suave); cursor: pointer; }
      .desc { color: #c7cad8; margin: 8px 0 0; }
      .meta { color: var(--suave); font-size: 12px; }
      #etiqueta { position: absolute; left: 18px; top: 14px; font: 800 22px Rubik, sans-serif; text-shadow: 0 2px 8px rgba(0,0,0,.4); pointer-events: none; }
      #etiqueta span { font: 700 10px Rubik, sans-serif; letter-spacing: .12em; background: rgba(255,255,255,.14); padding: 3px 7px; border-radius: 5px; margin-left: 8px; vertical-align: middle; }
      .ayuda { color: var(--suave); font-size: 12px; margin-top: 18px; }
      @media (max-width: 900px) {
        body { grid-template-columns: 1fr; grid-template-rows: auto 50vh auto; height: auto; overflow: auto; }
        #lista, #panel { border-width: 0; }
      }
    </style>
  </head>
  <body>
    <aside id="lista"><h1>Taller de modelos</h1></aside>
    <main><canvas id="lienzo"></canvas><div id="etiqueta"></div></main>
    <aside id="panel"></aside>
    <script type="module" src="/src/modelos/visor.ts"></script>
  </body>
</html>
