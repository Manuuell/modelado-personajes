<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taller de mejoras · Meta Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; min-height: 100%; font-family: Rubik, system-ui, sans-serif; }
      /* Fondo con la luz del mapa: llanura rojiza bajo el cielo naranja. */
      #fondo { position: fixed; inset: 0; background: linear-gradient(#e09474 0, #c4775c 38%, #9a5548 39%, #7e4140 100%); }
      #aviso { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; color: #fff; font-weight: 700; text-shadow: 0 2px 0 #3a1a2a; }
      .hoja { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; padding: 28px; }
      .hoja figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .losa {
        width: 112px; height: 112px; border-radius: 26px; display: grid; place-items: center;
        background: linear-gradient(color-mix(in srgb, var(--c) 82%, #fff), color-mix(in srgb, var(--c) 48%, #000));
        border: 4px solid #120c1c; box-shadow: 0 5px 0 rgba(0, 0, 0, 0.4), inset 0 3px 0 rgba(255, 255, 255, 0.35);
      }
      .losa svg { width: 80px; height: 80px; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.45)); }
      .hoja figcaption { font-size: 13px; font-weight: 800; color: #fff; text-align: center; text-shadow: 0 2px 0 #3a1a2a; }
    </style>
  </head>
  <body>
    <div id="fondo"></div>
    <div id="aviso"></div>
    <div id="ui"></div>
    <script type="module" src="/src/mundo/taller-mejoras.ts"></script>
  </body>
</html>
